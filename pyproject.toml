[project]
name = "benchharness"
version = "0.1.0"
description = "Unified multi-suite benchmark harness for local LLMs (LM Studio-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
datasets = ["datasets>=2.14", "huggingface-hub>=0.20"]
swe = ["swebench>=3.0", "datasets>=2.14"]
claw = ["modelscope>=1.30", "addict>=2.4", "datasets>=2.14"]
dev = ["pytest>=8.0", "ruff>=0.8"]
tui = ["textual>=3.0"]

[project.scripts]
bench-harness = "benchharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PLW", "PERF", "PIE", "FURB", "ISC", "S"]
ignore = [
    # Broad catches are intentional isolation boundaries: one bad dataset
    # row, optional import, or adapter must not kill a whole benchmark run.
    "BLE001",
    # False positive on runtime files: both __enter__ methods return self.
    "PYI034",
    # All subprocess calls use argv lists, never shell=True (S602 stays on).
    "S603",
    # docker/harbor/python resolve via PATH by design (Colima shims).
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
