[project]
name = "benchharness"
version = "0.1.0"
description = "Unified multi-suite benchmark harness for local LLMs (LM Studio-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
datasets = ["datasets>=2.14", "huggingface-hub>=0.20"]
swe = ["swebench>=3.0", "datasets>=2.14"]
dev = ["pytest>=8.0"]

[project.scripts]
bench-harness = "benchharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
